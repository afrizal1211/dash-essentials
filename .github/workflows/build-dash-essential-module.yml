name: Dash Essential module

# Builds the KernelSU Next / Magisk root module on a GitHub-hosted x86_64
# runner.
#
# The project cannot be built on the target phone. The Android NDK ships a
# linux-x86_64 host toolchain only, and `flutter assemble` AOT-compiles
# libapp.so with a host gen_snapshot that Flutter publishes for x86_64 hosts
# only, so a normal x86_64 Linux machine (or this workflow) is required.
#
# The pinned custom Flutter runtime is installed by
# tools/fetch-flutter-engine-prebuilt.sh: Flutter 3.44.8 stable, engine
# 0cd61071..., which is the engine runtime/flutter-engine/include/embedder.h
# and runtime/host-rust were written against. Do not change one without the
# other.
#
# Development signing key. The release keystore is not in the repository and
# its private key is not recoverable, so this workflow signs with a
# throwaway development key and sets DASH_ALLOW_UNOFFICIAL_SIGNING=1. The
# resulting ZIP is a `-dev` build: it is never written to the stable module
# path and never shared a signature with published releases. Add a base64
# JKS as the DASH_DEV_KEYSTORE_BASE64 secret (alias
# `dash-essential-development`, store and key password `android`) to keep one
# stable development signature across runs so `adb install -r` style updates
# keep working.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  DASH_FLUTTER_VERSION: "3.44.8"
  DASH_DEV_KEY_ALIAS: dash-essential-development
  DASH_DEV_KEY_PASS: android

jobs:
  module:
    name: KernelSU Next / Magisk module
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android/sdk/system-images \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost
          df -h /

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Flutter SDK ${{ env.DASH_FLUTTER_VERSION }}
        run: |
          set -euo pipefail
          archive="flutter_linux_${DASH_FLUTTER_VERSION}-stable.tar.xz"
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/$archive"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$url"
          mkdir -p "$RUNNER_TEMP/flutter"
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/flutter" --strip-components=1
          rm -f "$RUNNER_TEMP/$archive"
          git config --global --add safe.directory "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Android SDK platform 36, build-tools and NDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sdkmanager="$(ls -d "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)"
          if [ -z "$sdkmanager" ]; then
            echo "sdkmanager not found under $sdk" >&2
            ls -la "$sdk" >&2 || true
            exit 1
          fi
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          newest() {
            "$sdkmanager" --list 2>/dev/null \
              | awk -F'|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1}' \
              | grep -E "^$1;[0-9]" \
              | sort -V \
              | tail -1
          }
          [ -d "$sdk/platforms/android-36" ] || "$sdkmanager" "platforms;android-36"
          if ! find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null | grep -q .; then
            "$sdkmanager" "$(newest build-tools)"
          fi
          if ! find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null | grep -q .; then
            "$sdkmanager" "$(newest ndk)"
          fi
          echo "platforms: $(ls "$sdk/platforms")"
          echo "build-tools: $(ls "$sdk/build-tools")"
          echo "ndk: $(ls "$sdk/ndk")"

      - name: Pinned Flutter engine prebuilt
        run: tools/fetch-flutter-engine-prebuilt.sh

      - name: Flutter packages and engine artifacts
        run: |
          set -euo pipefail
          flutter --version
          flutter config --no-analytics >/dev/null
          flutter precache --android
          flutter pub get --directory ui/flutter

      - name: Development signing key
        env:
          DASH_DEV_KEYSTORE_BASE64: ${{ secrets.DASH_DEV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dash-essential-development.jks"
          if [ -n "${DASH_DEV_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DASH_DEV_KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            keytool -genkeypair \
              -keystore "$keystore" \
              -storetype JKS \
              -storepass "$DASH_DEV_KEY_PASS" \
              -keypass "$DASH_DEV_KEY_PASS" \
              -alias "$DASH_DEV_KEY_ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -dname "CN=Dash Essential Development,O=Dash Essential,C=NP"
          fi
          {
            echo "DASH_KEYSTORE=$keystore"
            echo "DASH_KEYSTORE_PASS=$DASH_DEV_KEY_PASS"
            echo "DASH_KEY_PASS=$DASH_DEV_KEY_PASS"
            echo "DASH_KEY_ALIAS=$DASH_DEV_KEY_ALIAS"
            echo "DASH_ALLOW_UNOFFICIAL_SIGNING=1"
          } >> "$GITHUB_ENV"

      - name: Build module
        run: tools/build-kernelsu-next-module.sh

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: dash-essential-kernelsu-magisk
          path: |
            out/kernelsu-next/*/*.zip
            out/kernelsu-next/*/*.sha256
            out/kernelsu-next/*/application/Dash-Essential.apk
          if-no-files-found: error
          retention-days: 14
